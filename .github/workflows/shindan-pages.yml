# 診断ツール（public/shindan）だけを GitHub Pages に公開する
# 公開URL: https://weapon37.github.io/shindan/
# 事前設定: GitHub の Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
name: Deploy shindan to GitHub Pages

on:
  push:
    branches: [claude/x-post-screenshot-analyzer-ige60a]
    paths: ["public/shindan/**", ".github/workflows/shindan-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/shindan
      - id: deployment
        uses: actions/deploy-pages@v4
