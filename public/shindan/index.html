  /* 進捗 */

  /* 結果 */

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------
     質問データ
     score: 各軸への加点。+ = 1, ± = 0, − = -1
       A = 決めごと / B = 戻し方 / C = 夜の崩れにくさ
     ------------------------------------------------------------ */
  var QUESTIONS = [
    {
      text: "疲れて帰った日の夕食は、どうなることが多いですか？",
      choices: [
        { label: "なんとか自炊するか、決まったものを食べる", score: { A: 1 } },
        { label: "コンビニや外食で、その日の気分で選ぶ", score: { A: -1 } },
        { label: "疲れすぎて、食べる内容はどうでもよくなる", score: { A: -1, C: -1 } }
      ]
    },
    {
      text: "甘い飲み物（甘い缶コーヒー、ジュースなど）を飲む頻度は？",
      choices: [
        { label: "ほぼ飲まない。飲み物は水・お茶・ブラックと決めている", score: { A: 1 } },
        { label: "週に数回は飲む", score: { A: -1 } },
        { label: "ほぼ毎日飲む", score: { A: -1 } }
      ]
    },
    {
      text: "運動できない日が3日続いたら、気持ちはどうなりますか？",
      choices: [
        { label: "特に焦らない。できる日に戻ればいいと思える", score: { B: 1 } },
        { label: "少し焦るけど、立て直し方はなんとなくある", score: { B: 0 } },
        { label: "「もういいや」となり、そのまま止まりやすい", score: { B: -1 } }
      ]
    },
    {
      text: "夜、お腹が空いて眠れないときは？",
      choices: [
        { label: "食べるものを小分けのもの1つだけ、と決めている", score: { C: 1 } },
        { label: "冷蔵庫やお菓子を、その日の我慢次第で食べてしまう", score: { C: -1 } },
        { label: "夜に食べることが多く、翌朝後悔する", score: { C: -1 } }
      ]
    },
    {
      text: "食べ過ぎた翌日、どうしていますか？",
      choices: [
        { label: "戻し方が決まっている（早く寝る、湯船に浸かる、タンパク質を多めにする、など）", score: { B: 1 } },
        { label: "なんとなく食事を軽くする程度", score: { B: 0 } },
        { label: "特に何もせず、ズルズル続く", score: { B: -1 } }
      ]
    },
    {
      text: "忙しい日の朝食は？",
      choices: [
        { label: "簡単でも、食べるものは決まっている", score: { A: 1 } },
        { label: "食べたり食べなかったり、その日次第", score: { A: -1 } },
        { label: "朝食抜きが当たり前になっている", score: { A: -1 } }
      ]
    },
    {
      text: "間食について、自分で決めていることは？",
      choices: [
        { label: "食べるものや量の線引きがある", score: { A: 1, C: 1 } },
        { label: "決めたいと思っているが、決まっていない", score: { A: -1 } },
        { label: "特に何も決めていない", score: { A: -1 } }
      ]
    },
    {
      text: "「これはやらない」と決めているものはありますか？",
      choices: [
        { label: "ある（甘い飲み物、夜のお菓子、など具体的に言える）", score: { A: 1 } },
        { label: "なんとなく避けているものはある", score: { A: 0 } },
        { label: "特にない", score: { A: -1 } }
      ]
    }
  ];

  /* ------------------------------------------------------------
     結果タイプ
     ------------------------------------------------------------ */
  var TYPES = {
    A: {
      name: "決めごとこれからタイプ",
      desc: "頑張る気持ちはあるのに、「これはやらない」という線引きがまだないので、その日の疲れや気分に流されやすい状態です。意志の問題ではなく、決めごとがまだないだけです。",
      min: "まず飲み物だけ決める。甘い飲み物は買わない、と1つだけ決める。"
    },
    C: {
      name: "夜に崩れるタイプ",
      desc: "昼間は整っているのに、夜の空腹と疲れで崩れやすい状態です。意志の問題ではなく、夜の選択肢が決まっていないだけです。",
      min: "夜お腹が空いたら、小分けのものを1袋だけ。それ以上は悩まなくていい、と先に決めておく。"
    },
    B: {
      name: "戻し方がないタイプ",
      desc: "食べ過ぎや疲れで崩れたあと、立て直す方法が決まっていないので、崩れたまま数日続いてしまいやすい状態です。崩れること自体は誰にでもあります。足りないのは「戻し方」の決めごとだけです。",
      min: "食べ過ぎた翌日は、早く寝る・湯船にゆっくり浸かる・タンパク質を少し多めに。この3つだけやる、と決めておく。"
    },
    KEEP: {
      name: "キープできてるタイプ",
      desc: "決めごとも戻し方もあり、崩れにくい状態です。あとは「疲れた日の最低ライン」を言葉にして決めておくと、忙しい時期も崩れにくくなります。",
      min: "今の習慣の中で「どんな日でもこれだけはやる」を1つ決めて、言葉にしておく。"
    }
  };

  /* ------------------------------------------------------------
     判定ロジック
     1. 各軸の合計（+1 / 0 / -1 の和）を出す
     2. 全軸の合計が 0 より大きい（＝プラス）なら「キープできてるタイプ」
     3. それ以外は「いちばん弱い軸」でタイプを決める
        軸ごとに設問数が違う（A=最大+5, B=最大+2, C=最大+2）ため、
        合計を最大値で割った割合で比べる。
        小数誤差を避けるため、最大値の最小公倍数(10)を掛けた整数で比較:
          A×2, B×5, C×5
     4. 同点なら A → C → B の優先順
     ------------------------------------------------------------ */
  var AXIS_MAX = { A: 5, B: 2, C: 2 };
  var TIE_ORDER = ["A", "C", "B"];

  function sumScores(answers) {
    var s = { A: 0, B: 0, C: 0 };
    answers.forEach(function (choiceIndex, qi) {
      var sc = QUESTIONS[qi].choices[choiceIndex].score;
      for (var k in sc) { if (Object.prototype.hasOwnProperty.call(sc, k)) s[k] += sc[k]; }
    });
    return s;
  }

  function judge(answers) {
    var s = sumScores(answers);
    if (s.A > 0 && s.B > 0 && s.C > 0) return "KEEP";
    var weakest = null, weakestVal = Infinity;
    TIE_ORDER.forEach(function (axis) {
      var v = s[axis] * (10 / AXIS_MAX[axis]); // 正規化（整数）
      if (v < weakestVal) { weakestVal = v; weakest = axis; } // 「<」なので同点は先勝ち＝A→C→B
    });
    return weakest;
  }

  /* ------------------------------------------------------------
     判定テストケース（回答は各問の選択肢番号 0/1/2、Q1〜Q8の順）
     ※ ブラウザのURL末尾に #test を付けて開くと、console に結果が出ます

     [1] 全部いちばん上        [0,0,0,0,0,0,0,0]
         A=+5 B=+2 C=+2 → 全軸プラス → KEEP（キープできてるタイプ）
     [2] 全部いちばん下        [2,2,2,2,2,2,2,2]
         A=-5 B=-2 C=-2 → 正規化 A=-10 C=-10 B=-10 → 同点 → A（決めごとこれからタイプ）
     [3] 夜だけ崩れる          [0,0,0,2,0,0,1,0]
         A=+3 B=+2 C=-1 → 正規化 A=6 C=-5 B=10 → C（夜に崩れるタイプ）
     [4] 戻し方だけない        [0,0,2,0,2,0,0,0]
         A=+5 B=-2 C=+2 → 正規化 A=10 C=10 B=-10 → B（戻し方がないタイプ）
     [5] 戻し方が「±」だけ     [0,0,1,0,1,0,0,0]
         A=+5 B=0 C=+2 → Bがプラスでない → 正規化 A=10 C=10 B=0 → B
     [6] 夜がいちばん弱い      [0,0,1,1,1,0,1,0]
         A=+3 B=0 C=-1 → 正規化 A=6 C=-5 B=0 → C
     [7] 決めごとが弱い        [2,1,0,0,0,1,1,1]
         A=-4 B=+2 C=0 → 正規化 A=-8 C=0 B=10 → A
     [8] 決めごとが少し弱い     [0,0,0,0,0,1,1,0]
         A=+1 B=+2 C=+1 → 全軸プラス → KEEP
     [9] C と B が同点(0)      [0,0,1,1,1,0,0,0]
         A=+5 B=0 C=0 → 正規化 A=10 C=0 B=0 → 同点は C 優先 → C
     [10] A と C が同点(0)     [2,0,0,0,0,0,1,1]
         A=0 B=+2 C=0 → 正規化 A=0 C=0 B=10 → 同点は A 優先 → A
     ------------------------------------------------------------ */
  var TEST_CASES = [
    { answers: [0,0,0,0,0,0,0,0], expect: "KEEP" },
    { answers: [2,2,2,2,2,2,2,2], expect: "A" },
    { answers: [0,0,0,2,0,0,1,0], expect: "C" },
    { answers: [0,0,2,0,2,0,0,0], expect: "B" },
    { answers: [0,0,1,0,1,0,0,0], expect: "B" },
    { answers: [0,0,1,1,1,0,1,0], expect: "C" },
    { answers: [2,1,0,0,0,1,1,1], expect: "A" },
    { answers: [0,0,0,0,0,1,1,0], expect: "KEEP" },
    { answers: [0,0,1,1,1,0,0,0], expect: "C" },
    { answers: [2,0,0,0,0,0,1,1], expect: "A" }
  ];
  function runTests() {
    var ok = 0;
    TEST_CASES.forEach(function (t, i) {
      var got = judge(t.answers);
      var pass = got === t.expect;
      if (pass) ok++;
      console[pass ? "log" : "error"]("[" + (i + 1) + "] " + (pass ? "OK" : "NG") + " expect=" + t.expect + " got=" + got, sumScores(t.answers));
    });
    console.log("判定テスト: " + ok + "/" + TEST_CASES.length + " passed");
    return ok === TEST_CASES.length;
  }
  // Node から検証できるように公開（ブラウザでは window.__shindan）
  var api = { QUESTIONS: QUESTIONS, TYPES: TYPES, judge: judge, sumScores: sumScores, TEST_CASES: TEST_CASES, runTests: runTests };
  if (typeof window !== "undefined") window.__shindan = api;
  if (typeof document === "undefined") return;

  /* ------------------------------------------------------------
     画面制御
     ------------------------------------------------------------ */
  var $ = function (id) { return document.getElementById(id); };
  var answers = [];
  var current = 0;
  var lastResult = null;
  var locked = false;

  // 定数の反映
  document.title = TOOL_NAME;
  $("tool-title").textContent = TOOL_NAME;
  $("profile").textContent = OPERATOR_PROFILE;
  $("line-btn").textContent = LINE_BUTTON_TEXT;
  $("line-btn").href = LINE_URL;
  $("q-total").textContent = QUESTIONS.length;
  $("progress").setAttribute("aria-valuemax", QUESTIONS.length);

  function show(id) {
    ["screen-top", "screen-question", "screen-result"].forEach(function (s) {
      $(s).classList.toggle("active", s === id);
    });
    window.scrollTo(0, 0);
  }

  function renderQuestion() {
    var q = QUESTIONS[current];
    $("q-num").textContent = current + 1;
    $("progress").setAttribute("aria-valuenow", current + 1);
    $("progress-bar").style.width = ((current + 1) / QUESTIONS.length * 100) + "%";
    $("q-text").textContent = "Q" + (current + 1) + ". " + q.text;
    var box = $("choices");
    box.innerHTML = "";
    q.choices.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "choice";
      b.textContent = c.label;
      b.addEventListener("click", function () { pick(i, b); });
      box.appendChild(b);
    });
    $("back-btn").hidden = current === 0;
    locked = false;
  }

  function pick(i, el) {
    if (locked) return;
    locked = true;
    el.classList.add("picked");
    answers[current] = i;
    setTimeout(function () {
      if (current < QUESTIONS.length - 1) {
        current++;
        renderQuestion();
        window.scrollTo(0, 0);
      } else {
        showResult();
      }
    }, 180);
  }

  function showResult() {
    var key = judge(answers);
    var t = TYPES[key];
    lastResult = t;
    $("r-type").textContent = t.name;
    $("r-desc").textContent = t.desc;
    $("r-min").textContent = t.min;
    $("copied").textContent = "";
    show("screen-result");
  }

  function pageUrl() {
    return location.protocol === "file:" ? "" : location.href.split("#")[0].split("?")[0];
  }

  function resultText() {
    var lines = [
      "【" + TOOL_NAME + "】",
      "私は「" + lastResult.name + "」でした。",
      "",
      "私の最低ライン：",
      lastResult.min
    ];
    var url = pageUrl();
    if (url) { lines.push("", "▼診断はこちら", url); }
    return lines.join("\n");
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject();
    });
  }

  $("start-btn").addEventListener("click", function () {
    answers = [];
    current = 0;
    renderQuestion();
    show("screen-question");
  });

  $("back-btn").addEventListener("click", function () {
    if (current > 0) {
      current--;
      renderQuestion();
    }
  });

  $("copy-btn").addEventListener("click", function () {
    if (!lastResult) return;
    copyText(resultText()).then(function () {
      $("copied").textContent = "コピーしました。Threadsなどに貼り付けてシェアできます。";
    }, function () {
      $("copied").textContent = "コピーできませんでした。お手数ですが画面を長押ししてコピーしてください。";
    });
  });

  $("retry-btn").addEventListener("click", function () {
    answers = [];
    current = 0;
    lastResult = null;
    show("screen-top");
  });

  if (location.hash === "#test") runTests();
})();
</script>
</body>
</html>
